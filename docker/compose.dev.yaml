# Entorno de previsualización con recarga en caliente.
# Uso: docker compose -f docker/compose.dev.yaml up -d  →  http://localhost:5173
services:
  web:
    image: node:22-alpine
    container_name: web-minimalista-dev
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0"
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      CI: 'true'
      npm_config_store_dir: /tmp/pnpm-store
    ports:
      - '5173:5173'
    volumes:
      - ..:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
